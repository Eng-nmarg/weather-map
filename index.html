<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather map</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

</head>
<body>
    <div class="container">
        <!--1-->

        <div class="con1">
            <!--section1-->
            <div class="search">
                <input type="text"id="country-inp" placeholder="Enter a country name here..." />
                <button id="search-btn"> <img src="image/search.png" alt=""> </button>
            </div>
            <!--section2--->
            <div id="map-container"  >

            </div>
             <!--section2--->
        </div>
        <!--2-->
        
        <!--2-->
        <div class="con2">
            <div class="map-weather-info"> 
                <!---->
                <div class="extra">
                    <span id="contryName">Contry</span>
                        <button class="btn-1">shear </button>
                        <button class="btn-2">save</button>
    
                    </div>

                    <div class="box">

                        <div class="day">
                             <div class = "day_weather"> 
                             <h4> day </h4>
                             <img src="image/temperature.svg" alt="">
                             <span> ${t} </span>
                              <span>${weather_status} </span>
                              <img src="image/cloud.svg" alt="">

                              <span>${clouds} </span>

                              <img src="image/wind.png" alt="">
                              <span>${wind}</span>

                              <img src="image/humidity.png" alt="">
                              <span>${humidity}</span>

         
                             </div>
                         </div>
         
                         <div class="wrapper">
                             <div class = "data-wrapper"> 
                               <h4> Capital </h4>
                               <span> ${capital} </span>
                     
                             </div>
                           </div>
         
                           <div class="wrapper">
                             <div class = "data-wrapper"> 
                               <h4> Capital </h4>
                               <span> ${capital} </span>
                     
                             </div>
                           </div>
         
                           <div class="wrapper">
                             <div class = "data-wrapper"> 
                               <h4> Capital </h4>
                               <span> ${capital} </span>
                     
                             </div>
                           </div>
         
                         </div>







            </div>






        </div>


        <!---->
















    </div>
   

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"  ></script>
 <script src="app.js" defer ></script>
